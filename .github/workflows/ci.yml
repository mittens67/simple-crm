name: CI

on:
  pull_request:
    branches:
      - '**'
  push:
    branches:
      - main

jobs:
  client:
    name: Client Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: client/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm --dir client install --frozen-lockfile

      - name: Lint
        run: pnpm --dir client lint

      - name: Typecheck
        run: pnpm --dir client exec tsc -b --noEmit

      - name: Test
        run: pnpm --dir client test -- --run

  server:
    name: Server Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: server/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm --dir server install --frozen-lockfile

      - name: Lint
        run: pnpm --dir server lint

      - name: Typecheck
        run: pnpm --dir server typecheck

      - name: Test
        run: pnpm --dir server test -- --run
